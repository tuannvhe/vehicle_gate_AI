# Cấu hình dataset cho việc fine-tune character_detector.pt.
# QUAN TRỌNG: thứ tự "names" phải giữ ĐÚNG NGUYÊN như model gốc (in ra bằng
# `YOLO('models/character_detector.pt').names`) - đây là fine-tune tiếp tục
# từ weight cũ (transfer learning), không phải train từ đầu, nên nếu đổi thứ
# tự/số lượng class, các lớp đã học trước đó sẽ bị gán nhầm nhãn.
#
# path: thư mục gốc chứa images/ và labels/ (tuyệt đối hoặc tương đối so với
# file data.yaml này).
path: dataset
train: images/train
val: images/val

nc: 32
names:
